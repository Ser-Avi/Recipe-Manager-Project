<form hx-post="/add_recipe/add" hx-push-url="/add_recipe/add" hx-target="#form-body" hx-swap="innerHTML" id="overview" class="max-w-l mx-auto self-center flex flex-wrap justify-center gap-x-16 mb-16">

  <div class="flex flex-col">
    <label for="name" class="block mb-2 text-l text-black font-bold">Recipe name</label>
    <input type="text" id="name" name="name" class="mb-4" value="{{ name }}" required >

    <label for="tag" class="block mb-2 text-l text-black font-bold">Tags</label>
    <div x-data="{tags: {{ tags }} }">
      <template x-for="(tag, index) in tags" :key="index">
        <div class="flex items-center justify-between">
          <input type="text" name="tag" id="tag" x-model="tag" required>
          <button type="button" @click="tags.splice(index, 1)" class="self-end recipe-button px-2 py-1 mx-4 my-2">X</button>
        </div>
      </template>
    </div>

    <label for="ingredient" class="block mb-2 text-l text-black font-bold">Ingredients</label>
    <div x-data="{ingredients: {{ingredients}} }">
      <template x-for="(ingredient, index) in ingredients" :key="index">
        <div class="flex items-center justify-between">
          <input type="text" name="ingredient" id="ingredient" x-model="ingredient" class="readonly" required>
          <button type="button" @click="ingredients.splice(index, 1)" class="self-end recipe-button px-2 py-1 mx-4 my-2">X</button>
        </div>
      </template>
    </div>
    <label for="servings" class="block mb-2 text-l text-black font-bold">Servings</label>
    <input type="number" min="1" id="servings" name="servings" class="mb-4" value="{{ servings }}" required></input>

    <label for="time-to-make-hours" class="block mb-2 text-l text-black font-bold">Time to make</label>
    <div class="flex flex-wrap">
      <div class="flex flex-row items-baseline">
        <input type="number" min="0" id="time-to-make-hours" name="time-to-make-hours" class="mb-4 max-w-16" value="{{ time_to_make_hours }}" required></input>
        <p class="ml-2 mr-6">hours</p>
      </div>
      <div class="flex flex-row items-baseline">
        <input type="number" min="0" max="59" id="time-to-make-minutes" name="time-to-make-minutes" class="mb-4 max-w-16" value="{{ time_to_make_minutes }}" required></input>
        <p class="mx-2">minutes</p>
      </div>
    </div>
  </div>
  <div class="flex flex-col">
    <label for="step" class="block mb-2 text-l text-black font-bold">Steps</label>
    <div x-data="{steps: {{steps}}}">
      <template x-for="(step, index) in steps" :key="index">
        <div class="flex items-center justify-between">
          <textarea name="step" id="step" rows="1" x-model="step" ></textarea>
          <button type="button" @click="steps.splice(index, 1)" class="self-end recipe-button px-2 py-1 mx-4 my-2">X</button>
        </div>
      </template>
    </div>
  </div>
</form>
<input form="overview" type="submit" value="Submit" class="self-center recipe-button" />
